# Laya, a CPU decision model (laya/Dockerfile), staged for the simulator. Reached only by the app, over the cluster network, on 8080.
# No internet, no volume (weights are in the image), no service-account token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laya
  namespace: commander-lab
  labels: {app: laya}
spec:
  # 0 since 2026-10-26: both checkpoints scored BELOW the always-guess baseline against the LLM's recorded decisions (English 16.1%, typed-decisions
  # 18.6%, baseline 27.5%, 149 states), and ~2 GB of the node's memory was needed for the card-search index build. Set to 1 to bring it back
  # (image, service and policy stay in place); it is only worth running once it is fine-tuned on this game's decisions (README).
  replicas: 0
  selector:
    matchLabels: {app: laya}
  template:
    metadata:
      labels: {app: laya}
    spec:
      automountServiceAccountToken: false
      # Kubernetes injects LAYA_PORT=tcp://<ip>:8080 for a Service named laya, and laya-serve reads LAYA_PORT as its own port setting
      # ("invalid LAYA_PORT 'tcp://...'", crash loop). Service-link variables are not wanted here at all.
      enableServiceLinks: false
      # NOT on talos-gmw: that node runs the Kubernetes API server, and Laya's first placement there (two checkpoints, 3.6 GB) took it from
      # 68% to 92% memory on 2026-10-26.
      nodeSelector: {kubernetes.io/hostname: talos-noy-0r4}
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: laya
          image: ghcr.io/fez5587/farmhouse-laya:v1
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: LAYA_THREADS, value: "4"}
            - {name: LAYA_PORT, value: "8080"}
            # One checkpoint only (about 1.9 GB): the English base scored below the always-guess baseline against the LLM; typed-decisions is the
            # fine-tuned one still being measured.
            - {name: LAYA_MODELS, value: "typed-decisions"}
            - {name: LAYA_DEFAULT_MODEL, value: "typed-decisions"}
            - {name: LAYA_MAX_LOADED, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "500m", memory: 2500Mi}
            limits: {cpu: "4", memory: 3Gi}
          # Loading two checkpoints takes a while; the port opens when the server is up.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: laya
  namespace: commander-lab
spec:
  type: ClusterIP
  selector: {app: laya}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# IN: only the app. OUT: nothing at all (the weights are in the image; it needs no DNS and calls no one).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laya
  namespace: commander-lab
spec:
  podSelector:
    matchLabels: {app: laya}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: commander-lab}
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
